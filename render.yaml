services:
  # Backend - FastAPI
  - type: web
    name: lxd-analytics-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: SHAREPOINT_SITE_URL
        sync: false
      - key: SHAREPOINT_FILE_NAME
        sync: false
      - key: SHAREPOINT_REFRESH_INTERVAL
        value: 300

  # Frontend - React Static Site
  - type: web
    name: lxd-analytics
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this manually after backend is deployed
      # Example: https://lxd-analytics-api.onrender.com
      - key: VITE_API_URL
        sync: false
